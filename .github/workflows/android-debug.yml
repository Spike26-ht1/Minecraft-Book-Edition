name: Android debug build

on:
  push:
    branches:
      - "launcher/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test and assemble debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Run unit tests and build debug APK
        run: gradle --no-daemon :launcher:app:testDebugUnitTest :launcher:app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Minecraft-Book-Edition-0.1.0-dev.2-debug
          path: launcher/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
